services:
  - type: web
    name: jarvis-cloud
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --ws-max-size 16384 --ws-max-queue 8
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ACCESS_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AZURE_SPEECH_KEY
        sync: false
      - key: AZURE_SPEECH_REGION
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GROQ_LLM_MODEL
        value: openai/gpt-oss-120b
